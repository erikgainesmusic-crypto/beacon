<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Erik Gaines</title>
  <meta name="description" content="Songs, notes, and things I'm making." />
  <meta name="theme-color" content="#f3eee4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3eee4;
      --surface: #fffcf6;
      --ink: #1b1914;
      --muted: #6e6a60;
      --accent: #2f4a3c;
      --line: rgba(27, 25, 20, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 5rem;
    }
    .kicker {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(2.75rem, 8vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1.05;
      text-wrap: balance;
    }
    .tag {
      margin: 1.25rem 0 0;
      max-width: 28rem;
      color: var(--muted);
      font-size: 1.125rem;
      text-wrap: pretty;
    }
    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 2.25rem 0;
    }
    .about {
      margin: 0 0 1rem;
      max-width: 36rem;
      font-size: 1.0625rem;
      text-wrap: pretty;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      margin-top: 2rem;
    }
    nav a {
      color: var(--accent);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    nav a:hover { border-bottom-color: currentColor; }
    footer {
      margin-top: 4rem;
      color: var(--muted);
      font-size: 0.8125rem;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Norfolk, Virginia</p>
    <h1>Erik Gaines</h1>
    <p class="tag">Songs, notes, and things I'm making.</p>
    <hr />
    <p class="about">Musician in Norfolk. This is a first website — a small page I own, sitting on the public internet.</p>
    <nav><a href="https://x.com/erikgainesmusic">X</a><a href="https://github.com/erikgainesmusic-crypto/beacon">GitHub</a></nav>
    <footer>Shipped via GitHub and Cloudflare Pages.</footer>
  </main>
</body>
</html>
